name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs-version:
          - 29.4
          - 30.2
          - snapshot  # Emacs 31 (pre-release)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Cache elpaca directory
        id: cache-elpaca
        uses: actions/cache@v4
        with:
          path: elpaca
          key: elpaca-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}
          restore-keys: |
            elpaca-${{ matrix.emacs-version }}-

      - name: Create stub files
        run: |
          touch ~/.dir-locals.el
          echo ";;" > ~/.private.el
          cp templates/zetta.example.el ~/.zetta.el

      - name: Sync missing packages
        if: steps.cache-elpaca.outputs.cache-hit != 'true'
        shell: bash
        run: bin/zetta ci-sync

      - name: Run CI test
        shell: bash
        run: bin/zetta ci-test
