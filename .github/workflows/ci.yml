name: CI

on:
  # The TEST matrix runs on PRs only.  The merge commit on main is
  # byte-for-byte identical to the PR's last-tested commit, so
  # re-TESTING on push to main catches nothing new -- but doubles CI
  # usage per merge, and quadruples it across a feature-PR ->
  # release-PR cycle.  Branch protection requires PR review, so direct
  # pushes to main are not a supported flow.  release-please still
  # fires on push to main via release.yml; that workflow is unaffected.
  #
  # Push to main triggers ONLY the `package` job below: it produces
  # something a PR run cannot (prebuilt store artifacts bound to the
  # merged lockfile, plus fresh main-scope caches), reconciling and
  # re-validating warm rather than re-testing cold.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly cold-install rehearsal.  Warm-cache PR runs only prove the
  # config loads against already-built packages; the install path itself
  # went untested for ten weeks (2026-05-07 -> 2026-07-22) while broken
  # for every fresh user, because caches kept every run warm.  Scheduled
  # and manually-dispatched runs skip the cache restore below and build
  # everything from nothing -- bootstrap, lockfile pins, every recipe --
  # exactly what a new clone experiences.  GitHub emails the repo owner
  # when a scheduled run fails.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A moved or private repo makes git prompt for credentials; in batch CI
  # the prompt is never answered, so the clone hangs silently until the
  # 30-minute job timeout with no package name in the log (measured: the
  # tools-category elpaca-wait hung 15 minutes past its last message).
  # Disabling the prompt turns that hang into an immediate, named failure.
  GIT_TERMINAL_PROMPT: "0"

jobs:
  test:
    # Push-to-main runs the package job instead (see trigger comment).
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    # A fully cold elpaca build measured ~25 minutes at the old
    # 1508298 pin; the 7484867 elpaca's event system costs 2-3x main-
    # process CPU on these 4-vCPU runners and the cost compounds on the
    # slow tail categories -- run 30071082660 was still syncing at
    # 300/318 when a 90-minute ceiling cancelled it, progressing
    # normally the whole way (runs 30064125083/30068189855 likewise at
    # 60).  A green cold job needs ~105 minutes end to end.  Cold
    # builds only happen on schedule/dispatch and epoch-cold first PR
    # runs -- warm-cache runs are minutes -- so pay for them with
    # ceiling instead of masking true wedges: the in-process watchdog
    # still kills a frozen queue at 20 minutes.  Cold 29.4 measured
    # 105-120+ minutes across four runs (two rode a 120 ceiling), so
    # 150 clears the variance band.  Follow-up: profile batch elpaca
    # on a 4-vCPU container and file upstream -- shrinking the build
    # is the real fix.  When the sync step crashes early (tolerated by
    # design) ci-test must do the whole cold build inside its own
    # elpaca window (4800s in bin/zetta); leave room for that plus the
    # stall dump.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs-version:
          - 29.4
          - 30.2
          - snapshot  # Emacs 31 (pre-release)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Restore elpaca cache
        # Restore-only (paired with the explicit save at the end of the
        # job): actions/cache's implicit post-step saves even from failed
        # jobs, and a cache captured mid-wedge poisons every later restore
        # (measured repeatedly during the cold-install repair, runs
        # 29951544889+).  Scheduled and manually-dispatched runs skip the
        # restore on purpose -- they are the cold fresh-install rehearsal.
        # v2 epoch: orphaned the v1 caches saved mid-wedge.  v3 epoch:
        # orphans every old-elpaca (pin 1508298) cache so the prefix
        # restore-key can never feed a pre-upgrade store into a
        # new-elpaca (pin 7484867, sources/ layout) run.  The bootstrap
        # also self-verifies the elpaca clone against the pin, so the
        # epoch bump is belt-and-braces rather than load-bearing.
        if: github.event_name == 'pull_request'
        id: cache-elpaca
        uses: actions/cache/restore@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}
          restore-keys: |
            elpaca-v3-${{ matrix.emacs-version }}-

      - name: Create stub files
        run: |
          touch ~/.dir-locals.el
          echo ";;" > ~/.private.el
          cp templates/zetta.example.el ~/.zetta.el

      - name: Sync missing packages
        if: steps.cache-elpaca.outputs.cache-hit != 'true'
        shell: bash
        run: bin/zetta ci-sync

      - name: Run CI test
        shell: bash
        run: bin/zetta ci-test

      - name: Save elpaca cache
        # Only a fully successful job may write the cache, so a restored
        # cache always means a known-good build state.  Cold (scheduled/
        # dispatched) successes also save, refreshing the cache weekly
        # from a verified-clean fresh install.  Skipped on exact cache
        # hits (nothing new to save); if the key already exists from a
        # concurrent job, the save is a no-op warning.
        if: success() && steps.cache-elpaca.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}

  package:
    # Publish prebuilt package stores so fresh installs can skip the
    # source build (~105 min on CI-class hardware, ~1h on modest user
    # machines -> minutes; see README "Prebuilt installs").  Runs on
    # push to main INSTEAD of the test matrix (see trigger comment).
    #
    # The store is never published untested: the job reconciles the
    # restored main-scope cache to the merged commit with ci-sync,
    # validates with ci-test, saves the refreshed cache, and only then
    # packages.  The manifest binds each artifact to the sha256 of the
    # exact elpaca-lock.el it was built from -- bin/zetta install
    # compares that against the local lock and falls back to a source
    # build on any mismatch, so a stale or missing artifact can never
    # produce a wrong install, only a slower one.
    #
    # Side benefit: main-scope caches now refresh on every merge
    # instead of only at the weekly rehearsal.  Worst case (no
    # restorable cache, e.g. right after a cache-epoch bump) this is a
    # full cold build -- the ceiling matches the test job's.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Higher than the test job's ceiling: this job stacks packaging on
    # top of the same build, and a cold 29.4 sync alone rode the
    # 120-minute ceiling on the first package run (30123672876).
    timeout-minutes: 150
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - 29.4
          - 30.2
          - snapshot  # Emacs 31 (pre-release)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Restore elpaca cache
        id: cache-elpaca
        uses: actions/cache/restore@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}
          restore-keys: |
            elpaca-v3-${{ matrix.emacs-version }}-

      - name: Create stub files
        run: |
          touch ~/.dir-locals.el
          echo ";;" > ~/.private.el
          cp templates/zetta.example.el ~/.zetta.el

      - name: Sync missing packages
        if: steps.cache-elpaca.outputs.cache-hit != 'true'
        shell: bash
        run: bin/zetta ci-sync

      - name: Run CI test
        shell: bash
        run: bin/zetta ci-test

      - name: Save elpaca cache
        if: success() && steps.cache-elpaca.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}

      - name: Package prebuilt store
        shell: bash
        run: |
          set -euo pipefail
          # ci-test can leave orphaned subprocesses (async native-comp
          # workers, copilot's node server) that keep mutating the tree
          # while tar reads it -- measured: run 30123672876/snapshot
          # died "File removed before we read it" on a file an orphan
          # touched.  Kill strays first, and tolerate tar's
          # warning-class exit 1 ("file changed/removed as we read
          # it"): the archive is still complete for every file that
          # held still, and the manifest/lock binding is what
          # guarantees correctness to consumers.
          pkill -f '[Ee]macs' 2>/dev/null || true
          pkill -f copilot 2>/dev/null || true
          sleep 2
          MM=$(emacs -Q --batch --eval '(princ (format "%s.%s" emacs-major-version emacs-minor-version))')
          FULL=$(emacs -Q --batch --eval '(princ emacs-version)')
          LOCK_SHA=$(sha256sum elpaca-lock.el | cut -d' ' -f1)
          # Menu caches regenerate cheaply and may embed absolute
          # paths: drop them.  Build dirs symlink into sources/ with
          # ABSOLUTE targets, so tar dereferences (-h) to materialize
          # portable copies.
          rm -rf elpaca/cache
          printf '{"emacs": "%s", "emacs_mm": "%s", "matrix": "%s", "lock_sha256": "%s", "commit": "%s", "created": "%s"}\n' \
            "$FULL" "$MM" "${{ matrix.emacs-version }}" "$LOCK_SHA" "${{ github.sha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > elpaca-manifest.json
          tar --zstd -chf "zetta-elpaca-$MM.tar.zst" elpaca-manifest.json elpaca || [ $? -eq 1 ]
          ls -lh "zetta-elpaca-$MM.tar.zst"

      - name: Upload to rolling prebuilt release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MM=$(emacs -Q --batch --eval '(princ (format "%s.%s" emacs-major-version emacs-minor-version))')
          gh release view prebuilt >/dev/null 2>&1 || \
            gh release create prebuilt --prerelease --title "Prebuilt package stores (rolling)" \
              --notes "Rolling prebuilt elpaca stores, refreshed on every merge to main.  Consumed automatically by bin/zetta install; each artifact's manifest binds it to the exact elpaca-lock.el it was built from, and installs fall back to a source build on any mismatch."
          gh release upload prebuilt "zetta-elpaca-$MM.tar.zst" --clobber
