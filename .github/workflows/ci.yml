name: CI

on:
  # The TEST matrix runs on PRs only.  The merge commit on main is
  # byte-for-byte identical to the PR's last-tested commit, so
  # re-TESTING on push to main catches nothing new -- but doubles CI
  # usage per merge, and quadruples it across a feature-PR ->
  # release-PR cycle.  Branch protection requires PR review, so direct
  # pushes to main are not a supported flow.  release-please still
  # fires on push to main via release.yml; that workflow is unaffected.
  #
  # Push to main triggers ONLY the `cache` job below: it refreshes the
  # main-scope elpaca caches against the merged commit (something PR
  # runs never save), reconciling and re-validating warm rather than
  # re-testing cold.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly cold-install rehearsal.  Warm-cache PR runs only prove the
  # config loads against already-built packages; the install path itself
  # went untested for ten weeks (2026-05-07 -> 2026-07-22) while broken
  # for every fresh user, because caches kept every run warm.  Scheduled
  # and manually-dispatched runs skip the cache restore below and build
  # everything from nothing -- bootstrap, lockfile pins, every recipe --
  # exactly what a new clone experiences.  GitHub emails the repo owner
  # when a scheduled run fails.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A moved or private repo makes git prompt for credentials; in batch CI
  # the prompt is never answered, so the clone hangs silently until the
  # 30-minute job timeout with no package name in the log (measured: the
  # tools-category elpaca-wait hung 15 minutes past its last message).
  # Disabling the prompt turns that hang into an immediate, named failure.
  GIT_TERMINAL_PROMPT: "0"

jobs:
  test:
    # Push-to-main runs the package job instead (see trigger comment).
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    # A fully cold elpaca build measured ~25 minutes at the old
    # 1508298 pin; the 7484867 elpaca's event system costs 2-3x main-
    # process CPU on these 4-vCPU runners and the cost compounds on the
    # slow tail categories -- run 30071082660 was still syncing at
    # 300/318 when a 90-minute ceiling cancelled it, progressing
    # normally the whole way (runs 30064125083/30068189855 likewise at
    # 60).  A green cold job needs ~105 minutes end to end.  Cold
    # builds only happen on schedule/dispatch and epoch-cold first PR
    # runs -- warm-cache runs are minutes -- so pay for them with
    # ceiling instead of masking true wedges: the in-process watchdog
    # still kills a frozen queue at 20 minutes.  Cold 29.4 measured
    # 105-120+ minutes across four runs (two rode a 120 ceiling), so
    # 150 clears the variance band.  Follow-up: profile batch elpaca
    # on a 4-vCPU container and file upstream -- shrinking the build
    # is the real fix.  When the sync step crashes early (tolerated by
    # design) ci-test must do the whole cold build inside its own
    # elpaca window (4800s in bin/zetta); leave room for that plus the
    # stall dump.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        emacs-version:
          - 29.4
          - 30.2
          # Released versions only.  Master (emacs-snapshot) proved too
          # unstable to gate on, and the Emacs 31 pretest
          # (release-snapshot) followed it out (2026-07-25): a pretest
          # version number doesn't pin the Lisp sources, so bytecode
          # from two builds both calling themselves "31.0" isn't
          # interchangeable, and a store built from a moving pretest
          # can never reliably match a user's local build.  Re-add 31
          # as a pinned entry once 31.1 ships.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Restore elpaca cache
        # Restore-only (paired with the explicit save at the end of the
        # job): actions/cache's implicit post-step saves even from failed
        # jobs, and a cache captured mid-wedge poisons every later restore
        # (measured repeatedly during the cold-install repair, runs
        # 29951544889+).  Scheduled and manually-dispatched runs skip the
        # restore on purpose -- they are the cold fresh-install rehearsal.
        # v2 epoch: orphaned the v1 caches saved mid-wedge.  v3 epoch:
        # orphans every old-elpaca (pin 1508298) cache so the prefix
        # restore-key can never feed a pre-upgrade store into a
        # new-elpaca (pin 7484867, sources/ layout) run.  The bootstrap
        # also self-verifies the elpaca clone against the pin, so the
        # epoch bump is belt-and-braces rather than load-bearing.
        if: github.event_name == 'pull_request'
        id: cache-elpaca
        uses: actions/cache/restore@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}
          restore-keys: |
            elpaca-v3-${{ matrix.emacs-version }}-

      - name: Create stub files
        run: |
          touch ~/.dir-locals.el
          echo ";;" > ~/.private.el
          cp templates/zetta.example.el ~/.zetta.el

      - name: Sync missing packages
        if: steps.cache-elpaca.outputs.cache-hit != 'true'
        shell: bash
        run: bin/zetta ci-sync

      - name: Run CI test
        shell: bash
        run: bin/zetta ci-test

      - name: Save elpaca cache
        # Only a fully successful job may write the cache, so a restored
        # cache always means a known-good build state.  Cold (scheduled/
        # dispatched) successes also save, refreshing the cache weekly
        # from a verified-clean fresh install.  Skipped on exact cache
        # hits (nothing new to save); if the key already exists from a
        # concurrent job, the save is a no-op warning.
        # NEVER saved from pull_request runs: branch-scoped PR caches
        # (~775MB x 3 versions per key-changing PR) are dead weight
        # after merge but count against the repo's 10GB quota, and a
        # burst of PRs evicts the MAIN-scope caches (measured: the
        # first cache-job run went full cold, 30123672876).  PRs
        # restore main's caches via the prefix key, and the cache job
        # refreshes main-scope on every merge, so PR-side saves buy
        # nothing but quota pressure.
        if: success() && steps.cache-elpaca.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}

  cache:
    # Refresh main-scope elpaca caches on every merge.  PR runs never
    # save caches (quota pressure -- see the test job's save comment),
    # so without this job caches would refresh only at the weekly cold
    # rehearsal and every PR run in between would pay the same re-sync
    # tax.  The job reconciles the restored cache to the merged commit
    # with ci-sync, re-validates with ci-test, and saves.
    #
    # This job once also packaged prebuilt package stores for
    # distribution (removed 2026-07-26): byte-compiling on a headless
    # Linux CI Emacs and shipping the result to other platforms and
    # Emacs builds produced a long tail of incompatibilities -- e.g.
    # bytecode calling a named setter that only exists when image.el
    # is loaded at compile time, and pretest version numbers that
    # don't pin core Lisp sources at all.  Users build locally with
    # whatever Emacs they bring.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Worst case (no restorable cache, e.g. right after a cache-epoch
    # bump) this is a full cold build; a cold 29.4 sync alone rode the
    # 120-minute ceiling on this job's first run (30123672876).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - 29.4
          - 30.2
          # Released versions only.  Master (emacs-snapshot) proved too
          # unstable to gate on, and the Emacs 31 pretest
          # (release-snapshot) followed it out (2026-07-25): a pretest
          # version number doesn't pin the Lisp sources, so bytecode
          # from two builds both calling themselves "31.0" isn't
          # interchangeable, and a store built from a moving pretest
          # can never reliably match a user's local build.  Re-add 31
          # as a pinned entry once 31.1 ships.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Restore elpaca cache
        id: cache-elpaca
        uses: actions/cache/restore@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}
          restore-keys: |
            elpaca-v3-${{ matrix.emacs-version }}-

      - name: Create stub files
        run: |
          touch ~/.dir-locals.el
          echo ";;" > ~/.private.el
          cp templates/zetta.example.el ~/.zetta.el

      - name: Sync missing packages
        if: steps.cache-elpaca.outputs.cache-hit != 'true'
        shell: bash
        run: bin/zetta ci-sync

      - name: Run CI test
        shell: bash
        run: bin/zetta ci-test

      - name: Save elpaca cache
        if: success() && steps.cache-elpaca.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: elpaca
          key: elpaca-v3-${{ matrix.emacs-version }}-${{ hashFiles('early-init.el', 'init.el', 'source/**', 'modules/**', 'elpaca-lock.el') }}
